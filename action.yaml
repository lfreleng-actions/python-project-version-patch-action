---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# python-project-version-patch-action
name: '🐍 Patch the Python Project Version'
description: 'Replaces/updates the Python project version string'
# Note: works with both pyproject.toml and setup.py

inputs:
  # Mandatory
  replacement_version:
    description: 'Replacement project version string'
    required: true
    # type: string
  path_prefix:
    description: 'Directory location containing project code'
    required: false
    default: '.'
    # type: string

runs:
  using: 'composite'
  steps:
    - name: 'Verify valid directory path'
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
      run: |
        # Verify valid directory path
        if [ ! -d "$INPUT_PATH_PREFIX" ]; then
          echo 'Error: invalid path/prefix to project directory ❌'; exit 1
        fi

    - name: 'Normalize and validate version'
      id: normalize
      shell: bash
      env:
        INPUT_REPLACEMENT_VERSION: ${{ inputs.replacement_version }}
      run: |
        set -euo pipefail
        # Normalize and validate version

        input_version="$INPUT_REPLACEMENT_VERSION"
        echo "Input version: $input_version"

        # Strip leading 'v' or 'V' if present (common in Git tags)
        normalized_version="${input_version#[vV]}"

        # Validate that the normalized version is not empty
        if [ -z "$normalized_version" ]; then
          echo "Error: Version string is empty after normalization" >&2
          exit 1
        fi

        # PEP 440 version grammar (epoch, release, pre, post, dev, local),
        # matched case-insensitively against the whole string. Rejecting
        # anything else also guarantees the value holds only characters
        # from [0-9A-Za-z.!+_-]: no newline, quote, '/', '&' or '\', so it
        # is safe to embed in the sed programs and $GITHUB_OUTPUT below.
        pep440_pattern='^([0-9]+!)?[0-9]+(\.[0-9]+)*([-_.]?(a|b|c|rc|alpha|beta|pre|preview)[-_.]?[0-9]*)?(-[0-9]+|[-_.]?(post|rev|r)[-_.]?[0-9]*)?([-_.]?dev[-_.]?[0-9]*)?(\+[0-9A-Za-z]+([-_.][0-9A-Za-z]+)*)?$'
        shopt -s nocasematch
        if ! [[ $normalized_version =~ $pep440_pattern ]]; then
          echo "Error: Version is not PEP 440 compliant ❌" >&2
          exit 1
        fi
        shopt -u nocasematch

        echo "Normalized version: $normalized_version"
        echo "normalized_version=$normalized_version" >> "$GITHUB_OUTPUT"

    # yamllint disable-line rule:line-length
    - uses: lfreleng-actions/path-check-action@fae378ddc06f437c39464ca02d6d9c362ca89d3c  # v0.2.2
      id: setup-py
      with:
        path: "${{ inputs.path_prefix }}/setup.py"

    # yamllint disable-line rule:line-length
    - uses: lfreleng-actions/path-check-action@fae378ddc06f437c39464ca02d6d9c362ca89d3c  # v0.2.2
      id: pyproject-toml
      with:
        path: "${{ inputs.path_prefix }}/pyproject.toml"

    - name: 'Patch Python project version: setup.py'
      id: patch-version-setup-py
      if: steps.setup-py.outputs.type == 'file'
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/file-sed-regex-action@12dd7fca1407a832a3591b544e7e23d5842aabeb # v0.2.0
      with:
        flags: '-i -E'
        # Replace only the quoted literal in the first version= line whose
        # value is exactly one string literal (followed only by an optional
        # comma or closing paren and comment), keeping indentation and the
        # tail; a computed value such as "1.0" if x else "2.0" is not
        # matched. Process every line (quitting early would truncate the
        # file under -i) and exit 1 on the last line if nothing matched.
        # yamllint disable-line rule:line-length
        regex: '0,/^([[:space:]]*version[[:space:]]*=[[:space:]]*)["''][^"'']*["'']([[:space:]]*[,)]*[[:space:]]*(#.*)?)$/{ /^([[:space:]]*version[[:space:]]*=[[:space:]]*)["''][^"'']*["'']([[:space:]]*[,)]*[[:space:]]*(#.*)?)$/{ s//\1"${{ steps.normalize.outputs.normalized_version }}"\2/; x; s/^/found/; x; }; }; ${ x; /^found/!{ x; q1; }; x; }'
        path: "${{ inputs.path_prefix }}/setup.py"
        debug: true

    # sed runs no commands on an empty file and exits 0, so confirm the
    # patch took effect instead of trusting the exit status alone
    - name: 'Verify patched version: setup.py'
      if: steps.setup-py.outputs.type == 'file'
      shell: bash
      env:
        PATCHED_FILE: "${{ inputs.path_prefix }}/setup.py"
        NORMALIZED_VERSION: ${{ steps.normalize.outputs.normalized_version }}
      run: |
        # Verify patched version: setup.py
        # Same match as the sed program: first version= line holding a
        # single string literal
        literal_re=$'^[[:space:]]*version[[:space:]]*=[[:space:]]*["\']([^"\']*)["\'][[:space:]]*[,)]*[[:space:]]*(#.*)?$'
        line=$(grep -m1 -E "$literal_re" "$PATCHED_FILE" || true)
        if [[ $line =~ $literal_re ]] &&
          [ "${BASH_REMATCH[1]}" = "$NORMALIZED_VERSION" ]; then
          echo "Version set to $NORMALIZED_VERSION in $PATCHED_FILE ✅"
        else
          echo "Error: no version=\"$NORMALIZED_VERSION\" in $PATCHED_FILE ❌"
          exit 1
        fi

    - name: 'Patch Python project version: pyproject.toml'
      id: patch-version-pyproject-toml
      if: steps.pyproject-toml.outputs.type == 'file'
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/file-sed-regex-action@12dd7fca1407a832a3591b544e7e23d5842aabeb # v0.2.0
      with:
        flags: '-i -E'
        # Replace the first version line, process every line, and exit 1
        # on the last line if nothing matched (see setup.py step above)
        # yamllint disable-line rule:line-length
        regex: '0,/^version =/{ /^version =/{ s/.*/version = "${{ steps.normalize.outputs.normalized_version }}"/; x; s/^/found/; x; }; }; ${ x; /^found/!{ x; q1; }; x; }'
        path: "${{ inputs.path_prefix }}/pyproject.toml"
        debug: true
        # yamllint enable rule:line-length

    - name: 'Verify patched version: pyproject.toml'
      if: steps.pyproject-toml.outputs.type == 'file'
      shell: bash
      env:
        PATCHED_FILE: "${{ inputs.path_prefix }}/pyproject.toml"
        NORMALIZED_VERSION: ${{ steps.normalize.outputs.normalized_version }}
      run: |
        # Verify patched version: pyproject.toml
        line=$(grep -m1 '^version =' "$PATCHED_FILE" || true)
        if [ "$line" = "version = \"$NORMALIZED_VERSION\"" ]; then
          echo "Version set to $NORMALIZED_VERSION in $PATCHED_FILE ✅"
        else
          echo "Error: no version = \"$NORMALIZED_VERSION\" in $PATCHED_FILE ❌"
          exit 1
        fi
