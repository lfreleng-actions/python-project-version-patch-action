---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  # Each version patches a fresh copy of the fixture in its own job, so no
  # case runs against a file that an earlier case has already modified
  tests:
    name: "Action Testing [${{ matrix.description }}]"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - description: "Without v prefix"
            # Python projects do not have a "v" prefix
            replacement_version: "0.2.0"
            expected_version: "0.2.0"
          - description: "With v prefix"
            # Test that action strips the "v" prefix (common in Git tags)
            replacement_version: "v3.0.0"
            expected_version: "3.0.0"
          - description: "PEP 440 dev release"
            replacement_version: "1.0.0.dev0"
            expected_version: "1.0.0.dev0"
          - description: "PEP 440 post release"
            replacement_version: "2.0.0.post1"
            expected_version: "2.0.0.post1"
          - description: "PEP 440 alpha with v"
            replacement_version: "v4.0.0a1"
            expected_version: "4.0.0a1"
          - description: "PEP 440 epoch and local with V"
            # Validation lets '!' and '+' through to the sed replacement,
            # which must write them literally
            replacement_version: "V1!2.0.0rc1+local.7"
            expected_version: "1!2.0.0rc1+local.7"
    steps:
      # Perform setup prior to running test(s)
      - name: "Checkout sample project repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "lfreleng-actions/test-python-project"
          path: "test-python-project"

      - name: 'Setup static version fixture for testing'
        shell: bash
        run: |
          # Setup static version fixture for testing
          # test-python-project now uses dynamic versioning;
          # copy static variation for version patching tests
          cp test-python-project/variations/static-eol.toml \
            test-python-project/pyproject.toml

      - name: "Run Action: ${{ github.repository }} [${{ matrix.description }}]"
        uses: $/
        with:
          path_prefix: "test-python-project/"
          replacement_version: ${{ matrix.replacement_version }}

      - name: "Verify only the version line changed"
        shell: bash
        env:
          EXPECTED_VERSION: ${{ matrix.expected_version }}
        run: |
          # Verify only the version line changed
          fixture=test-python-project/variations/static-eol.toml
          patched=test-python-project/pyproject.toml
          status=0
          # Compare by line number rather than by filtering out version
          # lines, so a truncated, lost, added or reordered line fails
          n=$(grep -n -m1 '^version = ' "$fixture" | cut -d: -f1)
          line=$(sed -n "${n}p" "$patched")
          if [ "$line" != "version = \"$EXPECTED_VERSION\"" ]; then
            echo "Error: line $n is not version = \"$EXPECTED_VERSION\" ❌"
            echo "Found: $line"
            status=1
          fi
          if ! diff -u <(sed "${n}d" "$fixture") \
            <(sed "${n}d" "$patched"); then
            echo "Error: patching altered lines other than version ❌"
            status=1
          fi
          if [ "$status" = 0 ]; then
            echo "Version $EXPECTED_VERSION patched, rest of file unchanged ✅"
          fi
          exit "$status"

  ### Test that invalid versions fail and leave project files unchanged ###
  invalid-versions:
    name: "Action Testing [Invalid: ${{ matrix.description }}]"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - description: "sed delimiter"
            replacement_version: "1.2/3"
          - description: "sed whole-match reference"
            replacement_version: "1.2&3"
          - description: "sed backreference"
            replacement_version: '1.2\1'
          - description: "double quote"
            replacement_version: '1.2"3'
          - description: "sed injection"
            replacement_version: "1.0.0/; s/.*/pwned = true/; s/x/x"
          - description: "embedded newline"
            # Double-quoted YAML scalar: \n is a real newline
            replacement_version: "1.0.0\nfoo=bar"
    steps:
      # One project per file type, so each sed program sees the value: in
      # a project with both, a value that breaks the setup.py program
      # stops the action before the pyproject.toml program runs
      - name: "Create project fixtures"
        shell: bash
        run: |
          # Create project fixtures
          mkdir -p pyproject-project setup-py-project
          cat > pyproject-project/pyproject.toml <<'EOF'
          [project]
          name = "demo"
          version = "0.0.1"
          dependencies = ["requests"]
          EOF
          cat > setup-py-project/setup.py <<'EOF'
          from setuptools import setup

          setup(
              name="demo",
              version="0.0.1",
              install_requires=["requests"],
          )
          EOF
          sha256sum pyproject-project/pyproject.toml \
            setup-py-project/setup.py > fixtures.sha256

      # If validation let the value through, sed would rewrite the files
      # (running injected commands, expanding '&' or '\1', or taking the
      # first line of a split GITHUB_OUTPUT value); the checksums catch
      # that even when a later check fails the run
      - name: "Run Action: ${{ github.repository }} [Invalid, pyproject]"
        id: invalid-pyproject
        continue-on-error: true
        uses: $/
        with:
          path_prefix: "pyproject-project/"
          replacement_version: ${{ matrix.replacement_version }}

      - name: "Run Action: ${{ github.repository }} [Invalid, setup.py]"
        id: invalid-setup-py
        continue-on-error: true
        uses: $/
        with:
          path_prefix: "setup-py-project/"
          replacement_version: ${{ matrix.replacement_version }}

      - name: "Verify invalid version failed and left the files unchanged"
        shell: bash
        env:
          PYPROJECT_OUTCOME: ${{ steps.invalid-pyproject.outcome }}
          SETUP_PY_OUTCOME: ${{ steps.invalid-setup-py.outcome }}
        run: |
          # Verify invalid version failed and left the files unchanged
          status=0
          if [ "$PYPROJECT_OUTCOME" != 'failure' ]; then
            echo "Error: pyproject.toml run outcome: $PYPROJECT_OUTCOME ❌"
            status=1
          fi
          if [ "$SETUP_PY_OUTCOME" != 'failure' ]; then
            echo "Error: setup.py run outcome: $SETUP_PY_OUTCOME ❌"
            status=1
          fi
          if ! sha256sum --check fixtures.sha256; then
            echo "Error: an invalid version modified a project file ❌"
            status=1
          fi
          if [ "$status" = 0 ]; then
            echo "Invalid version rejected, files unchanged ✅"
          fi
          exit "$status"

      # Control: the same fixtures accept a valid version, so the failures
      # above came from the version rather than the fixtures
      - name: "Run Action: ${{ github.repository }} [Control, pyproject]"
        uses: $/
        with:
          path_prefix: "pyproject-project/"
          replacement_version: "1.2.3"

      - name: "Run Action: ${{ github.repository }} [Control, setup.py]"
        uses: $/
        with:
          path_prefix: "setup-py-project/"
          replacement_version: "1.2.3"

  ### Test patching a setup.py-only project ###
  setup-py:
    name: "Action Testing [setup.py]"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: "Create setup.py project fixture"
        shell: bash
        run: |
          # Create setup.py project fixture
          # No pyproject.toml, so the action patches only setup.py
          mkdir -p setup-py-project
          cat > setup-py-fixture.py <<'EOF'
          from setuptools import setup

          setup(
              name="demo",
              version='0.0.1',  # replaced by the action
              description="Content after the version argument",
              packages=["demo"],
              install_requires=["requests"],
          )
          EOF
          cp setup-py-fixture.py setup-py-project/setup.py

      - name: "Run Action: ${{ github.repository }} [setup.py]"
        uses: $/
        with:
          path_prefix: "setup-py-project/"
          replacement_version: "v1.2.3"

      - name: "Verify setup.py was patched, preserved and still parses"
        shell: bash
        run: |
          # Verify setup.py was patched, preserved and still parses
          fixture=setup-py-fixture.py
          patched=setup-py-project/setup.py
          status=0
          expected='    version="1.2.3",  # replaced by the action'
          if ! grep -qxF "$expected" "$patched"; then
            echo "Error: version line not patched as expected ❌"
            status=1
          fi
          if [ "$(wc -l < "$fixture")" != "$(wc -l < "$patched")" ] ||
            ! diff -u <(grep -v '^    version=' "$fixture") \
              <(grep -v '^    version=' "$patched"); then
            echo "Error: patching altered lines other than version ❌"
            status=1
          fi
          parse='import ast,sys; ast.parse(open(sys.argv[1]).read())'
          if ! python3 -c "$parse" "$patched"; then
            echo "Error: patched setup.py is not valid Python ❌"
            status=1
          fi
          if [ "$status" = 0 ]; then
            echo "setup.py patched, preserved and parses ✅"
          else
            cat "$patched"
          fi
          exit "$status"

      # A computed value that starts with a string literal must not be
      # treated as a literal: patching it would report success while
      # Python still evaluates the original expression
      - name: "Create setup.py fixture with a computed version"
        shell: bash
        run: |
          # Create setup.py fixture with a computed version
          mkdir -p setup-py-computed
          cat > setup-py-computed/setup.py <<'EOF'
          from setuptools import setup

          setup(
              name="demo",
              version="1.0" if False else "9.0",
          )
          EOF
          sha256sum setup-py-computed/setup.py > setup-py-computed.sha256

      - name: "Run Action: ${{ github.repository }} [Computed setup.py]"
        id: computed-setup-py
        continue-on-error: true
        uses: $/
        with:
          path_prefix: "setup-py-computed/"
          replacement_version: "1.2.3"

      - name: "Verify computed version failed and left setup.py unchanged"
        shell: bash
        env:
          COMPUTED_OUTCOME: ${{ steps.computed-setup-py.outcome }}
        run: |
          # Verify computed version failed and left setup.py unchanged
          status=0
          if [ "$COMPUTED_OUTCOME" != 'failure' ]; then
            echo "Error: computed version run outcome: $COMPUTED_OUTCOME ❌"
            status=1
          fi
          if ! sha256sum --check setup-py-computed.sha256; then
            echo "Error: a computed version was rewritten ❌"
            status=1
          fi
          if [ "$status" = 0 ]; then
            echo "Computed version rejected, setup.py unchanged ✅"
          fi
          exit "$status"

  ### Test that files with no version to patch fail, unchanged ###
  no-version:
    name: "Action Testing [no version to patch]"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: "Create project files with no version to patch"
        shell: bash
        run: |
          # Create project files with no version to patch
          mkdir -p empty-setup-py empty-pyproject \
            no-version-setup-py no-version-pyproject
          : > empty-setup-py/setup.py
          : > empty-pyproject/pyproject.toml
          cat > no-version-setup-py/setup.py <<'EOF'
          from setuptools import setup

          setup(
              name="demo",
              use_scm_version=True,
          )
          EOF
          cat > no-version-pyproject/pyproject.toml <<'EOF'
          [project]
          name = "demo"
          dynamic = ["version"]

          [tool.hatch.version]
          source = "vcs"
          EOF
          sha256sum empty-setup-py/setup.py empty-pyproject/pyproject.toml \
            no-version-setup-py/setup.py no-version-pyproject/pyproject.toml \
            > no-version.sha256

      # The version is valid in every run. sed exits 0 on an empty file,
      # so only the action's post-patch version check can fail those two;
      # with no version line, the sed program itself exits 1
      - name: "Run Action: ${{ github.repository }} [Empty setup.py]"
        id: empty-setup-py
        continue-on-error: true
        uses: $/
        with:
          path_prefix: "empty-setup-py/"
          replacement_version: "1.2.3"

      - name: "Run Action: ${{ github.repository }} [Empty pyproject.toml]"
        id: empty-pyproject
        continue-on-error: true
        uses: $/
        with:
          path_prefix: "empty-pyproject/"
          replacement_version: "1.2.3"

      - name: "Run Action: ${{ github.repository }} [setup.py, no version]"
        id: no-version-setup-py
        continue-on-error: true
        uses: $/
        with:
          path_prefix: "no-version-setup-py/"
          replacement_version: "1.2.3"

      - name: "Run Action: ${{ github.repository }} [pyproject, no version]"
        id: no-version-pyproject
        continue-on-error: true
        uses: $/
        with:
          path_prefix: "no-version-pyproject/"
          replacement_version: "1.2.3"

      - name: "Verify each run failed and left its file unchanged"
        shell: bash
        env:
          EMPTY_SETUP_PY_OUTCOME: ${{ steps.empty-setup-py.outcome }}
          EMPTY_PYPROJECT_OUTCOME: ${{ steps.empty-pyproject.outcome }}
          NO_VERSION_SETUP_PY_OUTCOME: ${{ steps.no-version-setup-py.outcome }}
          # yamllint disable-line rule:line-length
          NO_VERSION_PYPROJECT_OUTCOME: ${{ steps.no-version-pyproject.outcome }}
        run: |
          # Verify each run failed and left its file unchanged
          status=0
          expect_failure() {
            if [ "$2" != 'failure' ]; then
              echo "Error: $1 run outcome: $2 ❌"
              status=1
            fi
          }
          expect_failure 'empty setup.py' "$EMPTY_SETUP_PY_OUTCOME"
          expect_failure 'empty pyproject.toml' "$EMPTY_PYPROJECT_OUTCOME"
          expect_failure 'setup.py, no version' "$NO_VERSION_SETUP_PY_OUTCOME"
          expect_failure 'pyproject.toml, no version' \
            "$NO_VERSION_PYPROJECT_OUTCOME"
          if ! sha256sum --check no-version.sha256; then
            echo "Error: a project file with no version was modified ❌"
            status=1
          fi
          if [ "$status" = 0 ]; then
            echo "Files with no version to patch rejected, unchanged ✅"
          fi
          exit "$status"
